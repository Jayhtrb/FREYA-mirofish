name: Simulation smoke test (full engine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Start backend and run full simulation smoke test
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.openai.com/v1
          LLM_MODEL_NAME: gpt-4o-mini
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run python run.py > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 120); do
            if curl -s http://localhost:5001/health >/dev/null 2>&1; then echo "backend up"; break; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then echo "backend died during startup"; cat /tmp/backend.log; exit 1; fi
            sleep 3
          done
          curl -s http://localhost:5001/health || { echo "backend failed to start"; cat /tmp/backend.log; exit 1; }
          FREYA_BASE_URL=http://localhost:5001 uv run python scripts/freya_simulation_smoke.py
          EXIT=$?
          echo "=== backend log tail ==="
          tail -100 /tmp/backend.log || true
          exit $EXIT
